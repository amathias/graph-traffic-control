[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "graph-traffic-control"
version = "0.1.0"
description = "Transactional coordination for autonomous data agents, powered by DataHub lineage"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "networkx>=3.4,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
# Pinned exactly, not ranged. These two talk to an instance shared with four other submissions,
# and the argument names, response envelopes, and aspect shapes this project implements were
# observed against these versions specifically. A floating range would let a patch release change
# a payload shape under a fail-closed reader and turn a working deploy into a refusal.
datahub = [
  "acryl-datahub==1.6.0.15",
  "mcp==1.28.1",
]
dev = [
  "build>=1.2,<2",
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
gtc-api = "graph_traffic_control.api:run"
gtc-seed = "graph_traffic_control.demo.seed:main"
gtc-reset = "graph_traffic_control.demo.reset:main"
gtc-demo = "graph_traffic_control.demo.scenario:main"
gtc-datahub-seed = "graph_traffic_control.demo.datahub_cli:seed_main"
gtc-datahub-reset = "graph_traffic_control.demo.datahub_cli:reset_main"
gtc-datahub-capture = "graph_traffic_control.demo.datahub_cli:capture_main"
gtc-datahub-restore = "graph_traffic_control.demo.datahub_cli:restore_main"
gtc-safety-scan = "graph_traffic_control.release.safety_scan:main"
gtc-archive-verify = "graph_traffic_control.release.archive:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_traffic_control"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
